services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: churn-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mapeia apenas a pasta api para hot-reload
      - ../src/api:/app/src/api
    environment:
      - PYTHONPATH=/app
    # Comando de desenvolvimento com hot-reload habilitado no FastAPI
    command: uv run fastapi dev src/api/main.py --host 0.0.0.0 --port 8000
    networks:
      - api-network

  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: churn-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - api-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:11.6.1
    container_name: churn-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - api-network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  api-network:
    driver: bridge
