# Pre-commit hooks configuration
# Usa uv para garantir ambiente consistente
#
# Instalação: uv run pre-commit install
# Execução manual: uv run pre-commit run --all-files

repos:
  # Ruff - Linter e formatter (muito rápido, escrito em Rust)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^notebooks/
      # Formatter
      - id: ruff-format
        exclude: ^notebooks/

  # MyPy - Verificação de tipos (usa ambiente local do uv)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^(tests|notebooks)/

  # Verificações gerais
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

# Configuração global
default_language_version:
  python: python3.13

# Excluir pasta docs/ de todas as verificações (arquivos gerados automaticamente)
exclude: ^docs/

# CI configuration
ci:
  autofix_prs: true
  autoupdate_commit_msg: 'chore: pre-commit autoupdate'
